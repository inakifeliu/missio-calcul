<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Missió Càlcul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: cockpit — fixed starfield behind bezelled instrument panels; tablet-first, landscape splits screen | keypad, portrait stacks */
:root{
  color-scheme: dark;
  --void:#060a17; --hull:#0f1730; --panel:#141e3a; --panel-2:#1b2850; --line:#2b3c6b; --line-hi:#3d5494;
  --text:#e8eeff; --dim:#8e9cc8;
  --amber:#ffb547; --amber-dim:#7a5622; --cyan:#62e7ff; --ok:#6cf08a; --alert:#ff5d5d; --violet:#b892ff;
  --f-display:'Chakra Petch','Trebuchet MS',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-mono:'Share Tech Mono',ui-monospace,monospace;
  --hullc:#dfe6f5;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--text);font-family:var(--f-body);font-size:17px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;min-height:100%;padding-inline:16px;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:12px;max-width:1200px;width:100%;margin:0 auto;min-height:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* Panels */
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel) 40%);border:2px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.45);position:relative;padding:14px}
.panel-tag{position:absolute;top:-11px;left:14px;background:var(--void);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font:12px var(--f-mono);letter-spacing:.12em;color:var(--amber)}
.label{font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.02em}

.btn{border:2px solid var(--line-hi);background:var(--panel-2);border-radius:12px;padding:12px 18px;font:700 16px var(--f-display);letter-spacing:.08em;text-transform:uppercase;transition:transform .08s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(180deg,#ffc76e,var(--amber));color:#1e1300;border-color:#ffd99a;box-shadow:0 0 0 4px rgba(255,181,71,.15),0 6px 0 #9a6413}
.btn.primary:active{box-shadow:0 0 0 4px rgba(255,181,71,.15),0 2px 0 #9a6413;transform:translateY(4px)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .who{display:flex;flex-direction:column;min-width:0;flex:1}
.who .nm{font:700 20px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sh{font:14px var(--f-mono);color:var(--cyan)}
.chip{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pts{font:22px var(--f-mono);color:var(--amber)}
.icon-btn{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px}

/* Ship */
.ship{width:150px;height:76px;display:block;overflow:visible}
.ship .flame{transform-origin:34px 40px;animation:flick .12s infinite alternate}
.ship.boost .flame{animation:boost .6s ease-out}
@keyframes flick{from{transform:scaleX(.85)}to{transform:scaleX(1.1)}}
@keyframes boost{0%{transform:scaleX(1)}30%{transform:scaleX(2.6)}100%{transform:scaleX(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Planet */
.planet{border-radius:50%;position:relative;flex:none;box-shadow:inset -6px -6px 14px rgba(0,0,0,.55),0 0 18px rgba(120,170,255,.15)}
.planet.ring::after{content:"";position:absolute;left:-30%;right:-30%;top:42%;height:16%;border-radius:50%;border:3px solid rgba(255,225,160,.75);transform:rotate(-14deg);box-sizing:border-box}

/* Bridge */
.bridge{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;flex:1;min-height:0}
.status{display:flex;flex-direction:column;gap:14px}
.window{height:140px;border-radius:12px;border:3px solid #33477e;background:radial-gradient(ellipse at 70% 40%,rgba(98,231,255,.08),transparent 60%),rgba(3,6,16,.55);position:relative;overflow:hidden;display:flex;align-items:center;padding-left:24px;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.window .far{position:absolute;right:20px;top:18px}
.window::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 35%);pointer-events:none}
.rank-row{display:flex;align-items:center;gap:14px}
.dial{width:96px;height:96px;flex:none}
.rank-name{font:700 22px var(--f-display);color:var(--amber)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.readout{background:rgba(3,6,16,.6);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.readout .v{font:26px var(--f-mono);color:var(--cyan);line-height:1.1}
.btn-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn-row .btn{padding:10px 6px;font-size:13px}
.launch{width:100%;padding:16px;font-size:18px;flex-direction:column;gap:2px}
.map{padding-top:26px}
.map>.panel-tag{top:6px}
.launch small{display:block;font:500 13px var(--f-body);letter-spacing:0;text-transform:none;opacity:.8}

.map{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:22px}
.sector h2{font-size:18px;color:var(--cyan);margin-bottom:4px}
.sector p{margin:0 0 12px;color:var(--dim);font-size:14px}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:rgba(10,16,36,.75);position:relative;min-width:0}
.node .nm{font:700 16px var(--f-display)}
.node .sk{font-size:13px;color:var(--dim);line-height:1.25;min-height:2.5em}
.node .st{font-size:18px;letter-spacing:2px;color:var(--amber)}
.node .st .off{color:#3a4670}
.node.locked{opacity:.4;filter:grayscale(.8)}
.node.target{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,181,71,.2),0 0 22px rgba(255,181,71,.25)}
.node.target::before{content:attr(data-target);position:absolute;top:-10px;font:700 11px var(--f-display);letter-spacing:.15em;background:var(--amber);color:#1e1300;border-radius:6px;padding:1px 8px}
.node .lock{font:12px var(--f-mono);color:var(--dim)}
.sector.closed .nodes{opacity:.5}
.lock-banner{border:1px dashed var(--line-hi);border-radius:10px;padding:10px 12px;color:var(--dim);font-size:14px;margin-bottom:10px}

/* Mission */
.m-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:stretch}
.route{display:flex;flex-direction:column;gap:6px;min-width:0}
.route .ttl{font:700 18px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:30px;display:flex;align-items:center;gap:8px}
.track .bar{flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#33477e 0 8px,transparent 8px 14px);position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);border-radius:3px;transition:width .6s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 10px var(--cyan)}
.track .marker{position:absolute;top:50%;width:34px;height:18px;transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px}
.shields{display:flex;gap:4px}
.shields i{width:18px;height:26px;border-radius:4px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transition:all .3s}
.shields i.off{background:#24304f;box-shadow:none}
.fuel{display:flex;gap:3px;align-items:flex-end;height:26px}
.fuel i{width:9px;border-radius:2px;background:#2a2a20;transition:background .3s}
.fuel i.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.score{font:26px var(--f-mono);color:var(--amber)}

.m-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:14px;min-height:0}
.m-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.m-window{height:110px;padding-left:30px}
.m-window .ship-wrap{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.m-window .ship-wrap.push{transform:translateX(60px)}
.asteroid{position:absolute;width:44px;height:38px;border-radius:45% 55% 50% 40%;background:radial-gradient(circle at 35% 35%,#8b7b6b,#4a3e33 70%);top:30px;right:-60px;box-shadow:inset -5px -5px 8px rgba(0,0,0,.5)}
.asteroid.fly{animation:astro .9s linear forwards}
@keyframes astro{to{right:110%;transform:rotate(-260deg)}}
.streak{position:absolute;right:14px;bottom:10px;font:14px var(--f-mono);color:var(--amber)}

.navscreen{flex:1;min-height:220px;border-radius:14px;border:3px solid #2a4f5c;background:radial-gradient(ellipse at center,rgba(20,60,70,.55),rgba(3,10,16,.92));box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 0 1px #0e2229;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.navscreen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(98,231,255,.04) 0 2px,transparent 2px 4px);pointer-events:none}
.navscreen .cap{position:absolute;top:10px;left:14px;font:12px var(--f-mono);letter-spacing:.15em;color:#4fb8c9}
.expr{font:700 clamp(40px,7vw,76px) var(--f-display);color:var(--cyan);text-shadow:0 0 18px rgba(98,231,255,.45);display:flex;align-items:center;gap:.3em;flex-wrap:wrap;justify-content:center;font-variant-numeric:tabular-nums;line-height:1}
.slot{min-width:1.6em;padding:.08em .25em;border:3px solid var(--amber);border-radius:12px;color:var(--amber);text-align:center;text-shadow:0 0 14px rgba(255,181,71,.5);background:rgba(255,181,71,.06);position:relative}
.slot.empty::after{content:"";display:inline-block;width:.08em;height:.8em;background:var(--amber);animation:blink 1s steps(1) infinite;vertical-align:-.05em}
@keyframes blink{50%{opacity:0}}
.slot.ok{border-color:var(--ok);color:var(--ok)}
.slot.bad{border-color:var(--alert);color:var(--alert)}
.groups{display:flex;flex-direction:column;gap:6px;align-items:center}
.groups .row{display:flex;gap:6px;padding:4px 8px;border:1px dashed rgba(98,231,255,.35);border-radius:8px}
.crate{width:22px;height:22px;border-radius:4px;background:linear-gradient(135deg,#ffcf7a,#d48a1f);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.groups .gl{font:14px var(--f-mono);color:#7fd8e6}

.fb{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;z-index:2}
.fb.okmsg{pointer-events:none}
.fb .big{font:700 34px var(--f-display);letter-spacing:.06em}
.fb.okmsg .big{color:var(--ok);text-shadow:0 0 16px rgba(108,240,138,.6);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.fb.badmsg{background:#1c0710}
.fb.badmsg .big{color:var(--alert);font-size:26px}
.hint{font-size:18px;line-height:1.5;max-width:34em}
.hint .ans{font:700 34px var(--f-display);color:var(--amber)}
.hint ol{margin:6px 0 0;padding-left:1.2em;text-align:left;font-family:var(--f-mono);font-size:19px;color:var(--text)}
.dots{display:inline-grid;gap:4px;margin:4px auto}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--cyan)}
.floater{position:absolute;font:700 26px var(--f-display);color:var(--amber);pointer-events:none;animation:floatup 1s ease-out forwards;z-index:3}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:stretch}
.key{border:2px solid var(--line-hi);border-radius:14px;background:linear-gradient(180deg,#24335f,#18234a);font:700 32px var(--f-display);min-height:64px;box-shadow:0 5px 0 #0b1229;transition:transform .05s,box-shadow .05s}
.key:active,.key.press{transform:translateY(4px);box-shadow:0 1px 0 #0b1229}
.key.del{font-size:22px;color:var(--alert)}
.key.go{grid-column:span 3;background:linear-gradient(180deg,#7df59a,#3fc566);color:#062010;border-color:#a8ffbe;box-shadow:0 5px 0 #1d6b33;font-size:24px;letter-spacing:.1em}
.key.go:active,.key.go.press{box-shadow:0 1px 0 #1d6b33}
.keypad.locked .key{opacity:.5;pointer-events:none}

.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,40,40,.45));opacity:0}
#flash.on{animation:fl .6s}
@keyframes fl{0%,60%{opacity:1}100%{opacity:0}}

/* Onboarding / result */
.center{flex:1;display:flex;align-items:center;justify-content:center}
.card{max-width:560px;width:100%;display:flex;flex-direction:column;gap:16px}
.card h1{font-size:30px;color:var(--amber)}
.card p{margin:0;line-height:1.5;color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:700 22px var(--f-display);background:rgba(3,6,16,.7);border:2px solid var(--line-hi);border-radius:10px;color:var(--cyan);padding:12px 14px;width:100%;box-sizing:border-box}
.result-planet{display:flex;justify-content:center;padding:10px 0}
.result-planet .planet{animation:arrive 1.2s cubic-bezier(.2,1,.3,1)}
@keyframes arrive{from{transform:scale(.1);opacity:0}}
.big-stars{display:flex;justify-content:center;gap:12px;font-size:56px;line-height:1}
.big-stars span{color:#2c3760;transition:color .2s}
.big-stars span.on{color:var(--amber);text-shadow:0 0 20px rgba(255,181,71,.7);animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res-grid .readout{text-align:center}
.res-actions{display:flex;gap:10px;flex-wrap:wrap}
.res-actions .btn{flex:1;min-width:160px}
.newach{display:flex;flex-direction:column;gap:6px}

/* Modal */
#modal{position:fixed;inset:0;z-index:10;background:rgba(2,4,12,.75);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modal .panel>*{flex-shrink:0}
#modal .panel{max-width:720px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:rgba(3,6,16,.5)}
.ach .badge{width:46px;height:46px;flex:none;display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:var(--amber);color:#1e1300;font:700 16px var(--f-display)}
.ach.off .badge{background:#2a3558;color:#55618a}
.ach.off .an{color:var(--dim)}
.ach .an{font:700 15px var(--f-display)}
.ach .ad{font-size:13px;color:var(--dim)}
.hulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hull{border:2px solid var(--line);border-radius:12px;padding:10px;background:rgba(3,6,16,.5);display:flex;flex-direction:column;align-items:center;gap:6px}
.hull.sel{border-color:var(--amber)}
.hull[disabled]{opacity:.4}
.hull .ship{width:110px;height:56px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td.n{font-family:var(--f-mono);text-align:right}
.tbl-wrap{overflow-x:auto}
.danger{border-color:var(--alert);color:var(--alert)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Toasts */
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;left:16px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#2b2410,#1b170a);border:2px solid var(--amber);border-radius:12px;padding:10px 14px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:tin .5s cubic-bezier(.3,1.5,.5,1)}
.toast.out{animation:tout .4s forwards}
.toast .badge{width:40px;height:40px;flex:none;display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:var(--amber);color:#1e1300;font:700 14px var(--f-display)}
.toast .tt{font:600 11px var(--f-display);letter-spacing:.15em;color:var(--amber)}
.toast .tn{font:700 16px var(--f-display)}
@keyframes tin{from{transform:translateX(120%)}}
@keyframes tout{to{transform:translateX(120%);opacity:0}}

/* Responsive */
@media (max-width:860px){
  .bridge{grid-template-columns:1fr}
  .m-body{grid-template-columns:1fr}
  .keypad{grid-template-columns:repeat(3,1fr)}
  .key{min-height:58px}
  .navscreen{min-height:200px}
}
@media (max-width:520px){
  .m-head{grid-template-columns:1fr 1fr}
  .m-head .route{grid-column:1/-1}
  .res-grid{grid-template-columns:1fr 1fr}
  .m-window{display:none}
  .btn-row .btn{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Stacked (column) arithmetic */
.stack{--cw:clamp(40px,6.4vw,56px);display:flex;flex-direction:column;gap:3px;font:700 clamp(28px,4.6vw,42px) var(--f-display);color:var(--cyan);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stack.mini{--cw:34px;font-size:24px;gap:2px}
.srow{display:grid;grid-template-columns:calc(var(--cw)*.7) repeat(var(--n),var(--cw));gap:4px;align-items:center;justify-items:center}
.ssign{color:var(--cyan)}
.sd{height:calc(var(--cw)*1.02);display:grid;place-items:center;position:relative;text-shadow:0 0 14px rgba(98,231,255,.4)}
.sd.struck{color:#4d8a98}
.sd.struck::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:3px;background:var(--alert);transform:rotate(-24deg)}
.sc{width:calc(var(--cw)*.66);height:calc(var(--cw)*.66);padding:0;font:700 .58em var(--f-display);border:2px dashed #8a6a33;border-radius:8px;background:rgba(255,181,71,.05);color:var(--amber);display:grid;place-items:center}
.sr{width:var(--cw);height:calc(var(--cw)*1.12);padding:0;border:3px solid var(--line-hi);border-radius:10px;background:rgba(255,181,71,.04);color:var(--amber);font:inherit;display:grid;place-items:center}
.stack.mini .sr{border-width:2px}
.sc.sel,.sr.sel{border:3px solid var(--amber);background:rgba(255,181,71,.16);box-shadow:0 0 14px rgba(255,181,71,.45)}
.sr.ok,.sc.ok{border-color:var(--ok);color:var(--ok);border-style:solid}
.sr.bad{border-color:var(--alert);color:var(--alert);background:rgba(255,93,93,.12)}
.sc.warn{border:3px solid var(--alert);background:rgba(255,93,93,.12)}
.sline{height:4px;width:100%;background:var(--cyan);border-radius:2px;box-shadow:0 0 8px rgba(98,231,255,.6)}
.tip{font-size:15px;color:#9fdbe6;text-align:center;max-width:32em;position:relative;z-index:1}
#scr-mission.stackmode .m-window{height:64px}
#scr-mission.stackmode .m-window .ship{width:100px;height:50px}
.fb.okmsg.banner{justify-content:flex-end;padding-bottom:14px}
.fb.okmsg .sub{font:600 17px var(--f-body);color:var(--amber);background:rgba(20,14,0,.85);border:1px solid var(--amber);border-radius:10px;padding:6px 12px}
.sol{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.sol ol{font-size:16px}

/* Profiles */
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:14px;border:2px solid var(--line);background:rgba(10,16,36,.8);text-align:center}
.prof:hover{border-color:var(--amber)}
.prof .nm{font:700 20px var(--f-display)}
.prof .rk{font:14px var(--f-mono);color:var(--amber)}
.prof .sh{font-size:13px;color:var(--dim)}
.prof.add{border-style:dashed;justify-content:center;min-height:150px;color:var(--cyan);font:700 18px var(--f-display);letter-spacing:.06em}

/* Report */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .btn{padding:8px 14px;font-size:14px}
.tabs .btn.on{border-color:var(--amber);color:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:rgba(3,6,16,.6);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile .v{font:24px var(--f-mono);color:var(--cyan);line-height:1.2}
.tile .s{font-size:13px;color:var(--dim)}
.up{color:var(--ok)}.down{color:var(--alert)}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--cyan)}
.chart .bar.today{fill:var(--amber)}
.chart .grid{stroke:#24305a;stroke-width:1}
.chart text{fill:var(--dim);font:11px 'Share Tech Mono',monospace}
.sec-h{font:700 15px var(--f-display);color:var(--cyan);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.meter{height:8px;background:#24305a;border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--ok)}
.note{font-size:15px;line-height:1.5;color:var(--text);margin:0}
.seg{display:inline-flex;border:2px solid var(--line-hi);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font:600 14px var(--f-display)}
.seg button.on{background:var(--amber);color:#1e1300}
.lang-slot{display:flex}
.seg button{min-width:44px;min-height:40px}
</style>

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="flash"></div>
<div id="toasts" aria-live="polite"></div>

<div id="app">
  <!-- PROFILES -->
  <section class="screen" id="scr-profiles" hidden>
    <div class="topbar">
      <div class="who"><span class="nm" data-i18n="p.title"></span><span class="sh" data-i18n="p.sub"></span></div>
      <div class="lang-slot"></div>
      <button class="btn" id="p-parents" data-i18n="parents"></button>
    </div>
    <div class="panel">
      <span class="panel-tag" data-i18n="crew"></span>
      <div class="prof-grid" id="p-grid"></div>
    </div>
  </section>

  <!-- ONBOARDING -->
  <section class="screen" id="scr-onboard" hidden>
    <div class="center">
      <div class="panel card">
        <span class="panel-tag" data-i18n="academy"></span>
        <div class="lang-slot" style="align-self:flex-end"></div>
        <div style="display:flex;justify-content:center"><div class="bob" id="ob-ship"></div></div>
        <h1 data-i18n="ob.h"></h1>
        <p data-i18n="ob.p"></p>
        <div class="field"><label class="label" for="in-name" data-i18n="ob.name"></label><input id="in-name" maxlength="16" autocomplete="off" data-i18n-ph="ob.namePh"></div>
        <div class="field"><label class="label" for="in-ship" data-i18n="ob.ship"></label><input id="in-ship" maxlength="16" autocomplete="off" placeholder="Estel-1"></div>
        <button class="btn primary launch" id="ob-go"><span data-i18n="ob.go"></span><small data-i18n="ob.goSmall"></small></button>
        <button class="btn ghost" id="ob-cancel" hidden data-i18n="ob.cancel"></button>
      </div>
    </div>
  </section>

  <!-- BRIDGE -->
  <section class="screen" id="scr-bridge" hidden>
    <div class="topbar">
      <div class="who"><span class="nm" id="b-name"></span><span class="sh" id="b-shipname"></span></div>
      <span class="pts mono" id="b-pts"></span>
      <button class="btn" id="b-switch" style="padding:10px 12px;font-size:13px" data-i18n="switchBtn"></button>
      <button class="icon-btn" id="b-mute" data-i18n-aria="muteAria"></button>
      <button class="icon-btn" id="b-settings" data-i18n-aria="optionsAria">⚙</button>
    </div>
    <div class="bridge">
      <div class="panel status">
        <span class="panel-tag" data-i18n="shipStatus"></span>
        <div class="window" id="b-window"><div class="far" id="b-far"></div><div class="bob" id="b-ship"></div></div>
        <div class="rank-row">
          <svg class="dial" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#24305a" stroke-width="10"/>
            <circle id="b-dial" cx="50" cy="50" r="42" fill="none" stroke="#ffb547" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset 1s"/>
            <text id="b-ranknum" x="50" y="58" text-anchor="middle" fill="#ffb547" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="26"></text>
          </svg>
          <div style="min-width:0">
            <div class="label" data-i18n="rank"></div>
            <div class="rank-name" id="b-rank"></div>
            <div class="mono" style="color:var(--dim);font-size:14px" id="b-next"></div>
          </div>
        </div>
        <div class="readouts">
          <div class="readout"><div class="label" data-i18n="correct"></div><div class="v" id="r-ok"></div></div>
          <div class="readout"><div class="label" data-i18n="bestStreak"></div><div class="v" id="r-streak"></div></div>
          <div class="readout"><div class="label" data-i18n="achievements"></div><div class="v" id="r-ach"></div></div>
          <div class="readout"><div class="label" data-i18n="flightDays"></div><div class="v" id="r-days"></div></div>
        </div>
        <button class="btn primary launch" id="b-launch"></button>
        <div class="btn-row">
          <button class="btn" id="b-ach" data-i18n="achievements"></button>
          <button class="btn" id="b-hangar" data-i18n="hangar"></button>
          <button class="btn" id="b-repair"></button>
        </div>
      </div>
      <div class="panel map" id="b-map">
        <span class="panel-tag" data-i18n="starMap"></span>
      </div>
    </div>
  </section>

  <!-- MISSION -->
  <section class="screen" id="scr-mission" hidden>
    <div class="m-head">
      <div class="panel route">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <span class="ttl" id="m-title"></span>
          <button class="btn ghost" id="m-abort" style="padding:6px 10px;font-size:12px" data-i18n="back"></button>
        </div>
        <div class="track"><div id="m-from"></div><div class="bar"><div class="fill" id="m-fill"></div><svg class="marker" id="m-marker" viewBox="0 0 160 80"></svg></div><div id="m-to"></div></div>
      </div>
      <div class="panel gauge"><span class="label" data-i18n="shields"></span><div class="shields" id="m-shields"></div></div>
      <div class="panel gauge"><span class="label" data-i18n="fuel"></span><div class="fuel" id="m-fuel"></div><span class="score mono" id="m-score">0</span></div>
    </div>
    <div class="m-body">
      <div class="m-left">
        <div class="window m-window" id="m-window"><div class="ship-wrap" id="m-shipwrap"><div class="bob" id="m-ship"></div></div><div class="asteroid" id="m-ast"></div><span class="streak" id="m-streak"></span></div>
        <div class="navscreen" id="m-screen">
          <span class="cap" id="m-cap"></span>
          <div class="groups" id="m-groups" hidden></div>
          <div class="expr" id="m-expr" aria-live="polite"></div>
          <div id="m-stack" hidden></div>
          <div class="tip" id="m-tip" hidden></div>
          <div id="m-fb"></div>
        </div>
      </div>
      <div class="panel keypad" id="kp">
        <span class="panel-tag" data-i18n="dataInput"></span>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="scr-result" hidden>
    <div class="center">
      <div class="panel card" id="res-card"></div>
    </div>
  </section>
</div>

<div id="modal" hidden><div class="panel" id="modal-body"></div></div>

const P=(a,op,b,h=2)=>({a,op,b,h});
const isStack=p=>p.kind==='stack';
function calc(p){
  if(isStack(p))return p.op==='+'?p.nums.reduce((x,y)=>x+y,0):p.nums[0]-p.nums[1];
  return p.op==='+'?p.a+p.b+(p.c||0):p.op==='-'?p.a-p.b:p.a*p.b;
}
const answer=p=>isStack(p)||p.h===2?calc(p):p.h===0?p.a:p.b;
const keyOf=p=>isStack(p)?`S${p.op}${p.nums.join(',')}`:`${p.a}${p.op}${p.b}${p.c?'+'+p.c:''}#${p.h}`;
const opChar=o=>o==='-'?'−':o;
const nDig=nd=>rnd(10**(nd-1),10**nd-1);

const g={
  add20(){const a=rnd(2,14);return P(a,'+',rnd(Math.max(1,5-a),20-a))},
  sub20(){const a=rnd(6,20);return P(a,'-',rnd(2,a-1))},
  add100n(){const t1=rnd(1,8),t2=rnd(1,9-t1),u1=rnd(0,9),u2=rnd(0,9-u1);return P(t1*10+u1,'+',t2*10+u2)},
  sub100n(){const t1=rnd(2,9),u1=rnd(1,9),t2=rnd(1,t1-1),u2=rnd(0,u1);return P(t1*10+u1,'-',t2*10+u2)},
  add100c(){const u1=rnd(2,9),u2=rnd(10-u1,9),t1=rnd(1,7),t2=rnd(0,8-t1);return P(t1*10+u1,'+',t2*10+u2)},
  sub100c(){const u1=rnd(0,8),u2=rnd(u1+1,9),t1=rnd(2,9),t2=rnd(0,t1-1);return P(t1*10+u1,'-',t2*10+u2)},
  mix100(){return pick([g.add100n,g.sub100n,g.add100c,g.add100c,g.sub100c,g.sub100c])()},
  add1000(){const a=rnd(100,800);return P(a,'+',rnd(20,Math.min(899,999-a)))},

  mix1000(){const r=Math.random();if(r<.35)return g.add1000();if(r<.7)return g.sub1000();const p=pick([g.add100c,g.sub100c,g.add100n,g.add1000])();p.h=rnd(0,1);return p},
  round4(){const a=rnd(11,89);if(Math.random()<.5)return P(a*100,'+',rnd(10,99-a)*100);return P(a*100,'-',rnd(10,a-1)*100)},
  zeroMental(){return pick([()=>P(100,'-',rnd(11,89)),()=>P(1000,'-',rnd(1,9)*100),()=>P(1000,'-',rnd(11,99)*10),()=>P(rnd(2,9)*100,'-',rnd(11,99))])()},
  three(){const p=P(rnd(2,9)*5,'+',rnd(2,9)*5);p.c=rnd(3,20);return p},
  mixBig(){return pick([g.round4,g.zeroMental,g.three,g.mix1000])()},
  groups(){const p=P(rnd(2,5),'×',rnd(2,5));p.groups=true;return p},
  table(n){return()=>{const k=rnd(1,10);return Math.random()<.5?P(n,'×',k):P(k,'×',n)}},

};
const S_=(op,nums)=>({kind:'stack',op,nums});
function hasCarry(nums){let c=0;const Lm=Math.max(...nums.map(len));for(let i=0;i<Lm;i++){const s=nums.reduce((x,y)=>x+dig(y,i),0)+c;c=Math.floor(s/10);if(c)return true}return false}
function hasBorrow(a,b){let br=0;for(let i=0;i<len(a);i++){const bb=dig(b,i)+br;br=dig(a,i)<bb?1:0;if(br)return true}return false}
function zeroBorrow(a,b){let br=0;for(let i=0;i<len(a);i++){if(br&&dig(a,i)===0)return true;const bb=dig(b,i)+br;br=dig(a,i)<bb?1:0}return false}
const sg={
  addN(nd){return()=>{let a=0,b=0;for(let i=0;i<nd;i++){const d1=i===nd-1?rnd(1,8):rnd(0,8);const d2=i===nd-1?rnd(1,9-d1):rnd(0,9-d1);a+=d1*10**i;b+=d2*10**i}return S_('+',[a,b])}},
  subN(nd){return()=>{let a=0,b=0;for(let i=0;i<nd;i++){const d1=i===nd-1?rnd(2,9):rnd(0,9);const d2=i===nd-1?rnd(1,d1-1):rnd(0,d1);a+=d1*10**i;b+=d2*10**i}return S_('-',[a,b])}},
  addC(nd){return()=>{for(let k=0;k<200;k++){const a=nDig(nd),b=Math.random()<.3&&nd>2?nDig(nd-1):nDig(nd);if(hasCarry([a,b])&&a+b<10**(nd+1))return S_('+',[a,b])}return S_('+',[58,67])}},
  subC(nd){return()=>{for(let k=0;k<200;k++){const a=nDig(nd),b=Math.random()<.3&&nd>2?nDig(nd-1):rnd(10**(nd-1),a-1);if(b<a&&b>=10&&hasBorrow(a,b))return S_('-',[a,b])}return S_('-',[82,47])}},
  zeros(){for(let k=0;k<300;k++){const nd=rnd(3,4);let a=rnd(2,9)*10**(nd-1);for(let i=0;i<nd-1;i++)if(Math.random()<.35)a+=rnd(1,9)*10**i;const b=rnd(Math.max(11,Math.floor(a/6)),a-1);if(zeroBorrow(a,b)&&len(b)>=nd-1)return S_('-',[a,b])}return S_('-',[5002,1768])},
  three(nd){return()=>{const nums=[nDig(nd),nDig(nd),Math.random()<.5?nDig(nd):nDig(Math.max(2,nd-1))];return S_('+',nums)}},
  mix(...gs){return()=>pick(gs)()}
};

const PLACE_IDX={1000:3,100:2,10:1,1:0};
const digitPart=(n,place)=>Math.floor(n/place)%10*place;
function hintFor(p){
  const a=p.a,b=p.b,r=calc(p),lines=[];let dots=null;
  if(p.c){lines.push(t('h.pairs'),`${a} + ${b} = ${a+b}`,`${a+b} + ${p.c} = ${r}`);return{lines,dots}}
  if(p.h!==2){
    if(p.op==='+'){if(p.h===0)lines.push(`? + ${b} = ${r}`,t('h.sub',{e:`${r} − ${b} = ${a}`}));else lines.push(`${a} + ? = ${r}`,t('h.sub',{e:`${r} − ${a} = ${b}`}))}
    else{if(p.h===0)lines.push(`? − ${b} = ${r}`,t('h.add',{e:`${r} + ${b} = ${a}`}));else lines.push(`${a} − ? = ${r}`,t('h.sub',{e:`${a} − ${r} = ${b}`}))}
    return{lines,dots};
  }
  if(p.op==='+'){
    const mx=Math.max(a,b),mn=Math.min(a,b);
    if(r<=20){
      if(mx<10&&r>10){const need=10-mx;lines.push(`${mx} + ${need} = 10`,t('h.left',{e:`${mn} − ${need} = ${mn-need}`}),`10 + ${mn-need} = ${r}`)}
      else if(mx>=10){lines.push(`${mx} = 10 + ${mx-10}`,`${mx-10} + ${mn} = ${mx-10+mn}`,`10 + ${mx-10+mn} = ${r}`)}
      else lines.push(t('h.countOn',{a:mx,b:mn,r}));
    }else{
      const parts=[];
      for(const pl of [1000,100,10,1]){const x=digitPart(a,pl),y=digitPart(b,pl);if(x||y){lines.push(`${coln(PLACE_IDX[pl])}: ${x} + ${y} = ${x+y}`);parts.push(x+y)}}
      lines.push(t('h.join',{e:`${parts.join(' + ')} = ${r}`}));
    }
  }else if(p.op==='-'){
    if(a<=20){
      if(a>10&&b>a-10){const s=a-10,rest=b-s;lines.push(t('h.down10',{e:`${a} − ${s} = 10`}),t('h.still',{n:rest,e:`10 − ${rest} = ${r}`}))}
      else if(a>10){lines.push(`${a} = 10 + ${a-10}`,`${a-10} − ${b} = ${a-10-b}`,`10 + ${a-10-b} = ${r}`)}
      else lines.push(t('h.countBack',{a,b,r}));
    }else{
      let cur=a;
      for(const pl of [1000,100,10,1]){const d=digitPart(b,pl);if(d){lines.push(t('h.take',{p:coln(PLACE_IDX[pl]).toLowerCase(),e:`${cur} − ${d} = ${cur-d}`}));cur-=d}}
    }
  }else{
    dots={rows:a,cols:b};
    if(a===10||b===10){const o=a===10?b:a;lines.push(t('h.x10',{o,r}))}
    else if(a===1||b===1){lines.push(t('h.x1',{r}))}
    else if(a<=5){lines.push(t('h.groups',{a,b}),`${Array(a).fill(b).join(' + ')} = ${r}`)}
    else if(b<=5){lines.push(t('h.swap',{a,b}),`${Array(b).fill(a).join(' + ')} = ${r}`)}
    else{lines.push(`${a} × ${b} = 5 × ${b} + ${a-5} × ${b}`,`${5*b} + ${(a-5)*b} = ${r}`)}
  }
  return{lines,dots};
}

/* ================= Stacked model ================= */
function stackModel(p,method){
  const m={op:p.op,nums:p.nums,carry:[],res:[],steps:[],carryIn:[]};
  if(p.op==='+'){
    const Lm=Math.max(...p.nums.map(len));m.n=Lm+1;m.method='add';
    const r=calc(p),rl=len(r);let c=0;
    for(let i=0;i<m.n;i++){
      const ds=p.nums.filter(x=>len(x)>i).map(x=>dig(x,i));const s=ds.reduce((x,y)=>x+y,0)+c;
      m.carryIn[i]=c>0;m.res[i]=i<rl?dig(r,i):null;
      if(ds.length)m.steps.push(`${coln(i)}: ${ds.join(' + ')}${c?t('s.carryIn',{n:c}):''} = ${s}`+(s>=10&&i<m.n-1?t('s.write',{d:s%10,n:Math.floor(s/10)}):''));
      else if(c)m.steps.push(t('s.bring',{c:coln(i),n:c}));
      c=Math.floor(s/10);
      if(i+1>=1&&i+1<=m.n-2)m.carry[i+1]=c?String(c):'';
    }
  }else{
    const[a,b]=p.nums;m.n=len(a);const r=a-b,rl=len(r);
    if(method==='borrow'){
      m.method='borrow';const cur=[];for(let i=0;i<m.n;i++)cur[i]=dig(a,i);const changed={};
      for(let i=0;i<m.n;i++){
        const bi=len(b)>i?dig(b,i):0;
        if(cur[i]<bi){
          let j=i+1;while(cur[j]===0)j++;const zeros=j>i+1;
          cur[j]-=1;changed[j]=cur[j];for(let k=j-1;k>i;k--){cur[k]=9;changed[k]=9}
          const v=cur[i]+10;m.carryIn[i]=true;
          m.steps.push(t('s.bor',{c:coln(i),v:cur[i],b:bi,how:t(zeros?'s.borZeros':'s.borNext'),v10:v,r:v-bi}));
          cur[i]=v;
        }else{if(changed[i]!==undefined)m.carryIn[i]=true;if(i<rl||bi)m.steps.push(t('s.plain',{c:coln(i),a:cur[i],b:bi,r:cur[i]-bi}))}
        m.res[i]=i<rl?dig(r,i):null;
      }
      for(let i=1;i<m.n;i++)m.carry[i]=changed[i]!==undefined?String(changed[i]):'';
    }else{
      m.method='comp';let br=0;
      for(let i=0;i<m.n;i++){
        const tt=dig(a,i),bd=len(b)>i?dig(b,i):0,bb=bd+br;m.carryIn[i]=br>0;
        const pre=br?t('s.compPre',{bd,bb}):'';let nb=0;
        if(tt<bb){nb=1;m.steps.push(t('s.compNo',{c:coln(i),pre,t:tt,bb,t10:tt+10,r:tt+10-bb}))}
        else if(i<rl||bb)m.steps.push(t('s.compOk',{c:coln(i),pre,t:tt,bb,r:tt-bb}));
        m.res[i]=i<rl?dig(r,i):null;
        if(i+1<m.n)m.carry[i+1]=nb?'1':'';
        br=nb;
      }
    }
  }
  return m;
}
function buildStack(model,opt){
  const n=model.n,box=el('div','stack'+(opt.mini?' mini':''));box.style.setProperty('--n',n);
  const row=(sign,cells)=>{const r=el('div','srow');r.append(el('span','ssign',sign||''));cells.forEach(c=>r.append(c));return r};
  const isSel=(ty,i)=>opt.sel&&opt.sel.t===ty&&opt.sel.i===i;
  const carryRow=()=>{const cells=[];for(let j=0;j<n;j++){const i=n-1-j;
      if(model.carry[i]===undefined){cells.push(el('span'));continue}
      const v=opt.vals.c[i]||'';const c=el(opt.interactive?'button':'span','sc',v);c.dataset.t='c';c.dataset.i=i;
      if(opt.interactive)c.setAttribute('aria-label',t(model.method==='borrow'?'aria.newTop':'aria.carry',{c:coln(i)}));
      if(isSel('c',i))c.classList.add('sel');const mk=opt.marks&&opt.marks.c[i];if(mk)c.classList.add(mk);cells.push(c)}
    return row('',cells)};
  const numRow=(num,sign,strike)=>{const cells=[];const s=String(num);for(let j=0;j<n;j++){const i=n-1-j;const d=i<s.length?s[s.length-1-i]:'';const c=el('span','sd',d);if(strike&&d&&i>0&&opt.vals.c[i])c.classList.add('struck');cells.push(c)}return row(sign,cells)};
  const resRow=()=>{const cells=[];for(let j=0;j<n;j++){const i=n-1-j;const v=opt.vals.r[i]||'';const c=el(opt.interactive?'button':'span','sr',v);c.dataset.t='r';c.dataset.i=i;
      if(opt.interactive)c.setAttribute('aria-label',t('aria.res',{c:coln(i)}));
      if(isSel('r',i))c.classList.add('sel');const mk=opt.marks&&opt.marks.r[i];if(mk)c.classList.add(mk);cells.push(c)}return row('',cells)};
  const line=()=>{const r=el('div','srow');r.append(el('span'));const l=el('div','sline');l.style.gridColumn=`2 / span ${n}`;r.append(l);return r};
  const opS=opChar(model.op);
  if(model.method==='add'){box.append(carryRow());model.nums.forEach((x,k)=>box.append(numRow(x,k===model.nums.length-1?opS:'')))}
  else if(model.method==='comp'){box.append(numRow(model.nums[0],''),carryRow(),numRow(model.nums[1],opS))}
  else{box.append(carryRow(),numRow(model.nums[0],'',true),numRow(model.nums[1],opS))}
  box.append(line(),resRow());return box;
}
function gradeStack(model,st){
  const marks={r:{},c:{}};let allOK=true,forgot=0,wrongC=0;const cols=[];
  for(let i=0;i<model.n;i++){
    const e=model.res[i],v=st.r[i]||'';
    const ok=e==null?(v===''||v==='0'):v===String(e);
    if(!(e==null&&v===''))marks.r[i]=ok?'ok':'bad';if(!ok)allOK=false;
    if(e!=null)cols.push({carry:!!model.carryIn[i],ok});
    const ce=model.carry[i];if(ce===undefined)continue;const cv=st.c[i]||'';
    if(ce===''){if(cv!==''&&!(cv==='0'&&model.method!=='borrow')){wrongC++;marks.c[i]='warn'}}
    else if(cv===''){forgot++;marks.c[i]='warn'}
    else if(cv!==ce){wrongC++;marks.c[i]='warn'}else marks.c[i]='ok';
  }
  return{allOK,forgot,wrongC,marks,cols};
}

function tone(f,d,type='sine',v=.12,when=0,to){const c=ac();if(!c)return;const tm=c.currentTime+when,o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,tm);if(to)o.frequency.exponentialRampToValueAtTime(to,tm+d);gn.gain.setValueAtTime(v,tm);gn.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(gn).connect(c.destination);o.start(tm);o.stop(tm+d+.02)}

let M=null;const QN=10;
function buildQueue(tier){
  const x=TIER[tier],keys=new Set();let nS=x.stack?x.nStack:0,nM=QN-nS;const q=[];
  const weak=shuffle(Object.values(S.weak).filter(w=>w.tier===tier));
  for(const w of weak.slice(0,2)){const p=JSON.parse(JSON.stringify(w.p));q.push(p);keys.add(keyOf(p));if(isStack(p))nS--;else nM--}
  const add=(gen,n)=>{let c=0,guard=0;while(c<n&&guard++<500){const p=gen();if(keys.has(keyOf(p)))continue;keys.add(keyOf(p));q.push(p);c++}};
  add(x.gen,Math.max(0,nM));if(x.stack)add(x.stack,Math.max(0,nS));
  return shuffle(q);
}

  else if(m.mode==='calib'){m.cal={tier:2,ok:0,bad:0,mastered:-1,wentDown:false,n:0,max:16};m.total=16;m.queue=[SECTOR_A[2].gen()]}

function press(k){
  if(!M||M.lock)return;const p=M.queue[M.idx];
  if(isStack(p)){pressStack(k);return}
  if(k==='del'){M.input=M.input.slice(0,-1)}
  else if(k==='go'){if(M.input)submitMental();return}
  else if(/^\d$/.test(k)&&M.input.length<5){M.input=(M.input==='0'?'':M.input)+k}
  else return;
  sfx.key();renderExpr();
}
function pressStack(k){
  const st=M.st,sel=M.sel,n=M.model.n;
  if(k==='go'){if(st.r.some(v=>v!==''))submitStack();return}
  if(k==='del'){if(sel.t==='c')st.c[sel.i]='';else if(st.r[sel.i]!=='')st.r[sel.i]='';else if(sel.i>0){sel.i--;st.r[sel.i]=''}}
  else if(k==='left'){if(sel.t==='r'&&sel.i<n-1)sel.i++}
  else if(k==='right'){if(sel.t==='r'&&sel.i>0)sel.i--}
  else if(/^\d$/.test(k)){
    if(sel.t==='c'){st.c[sel.i]=k;const e=st.r.findIndex(v=>v==='');M.sel={t:'r',i:e<0?Math.min(sel.i,n-1):e}}
    else{st.r[sel.i]=k;if(sel.i<n-1)sel.i++}
  }else return;
  sfx.key();renderStackLive();
}

function logAnswer(p,ok,secs,tierId){
  const kind=isStack(p)?'stack':p.op==='×'?'mult':'mental';const sk=kind==='mult'?'mult':kind+(p.op==='-'?'-':'+');
  const s=S.skill[sk]||(S.skill[sk]={ok:0,bad:0,sec:0});s[ok?'ok':'bad']++;s.sec+=Math.min(secs,180);
  const pl=S.planet[tierId]||(S.planet[tierId]={ok:0,bad:0});pl[ok?'ok':'bad']++;
  dayLog()[ok?'ok':'bad']++;
}
function storeWeak(p,key,tierId){

  const cp=isStack(p)?{kind:'stack',op:p.op,nums:p.nums.slice()}:{a:p.a,b:p.b,op:p.op,h:p.h};
  if(p.c)cp.c=p.c;if(p.groups)cp.groups=true;S.weak[key]={tier:tierId,p:cp,n:2};
}

  const p=M.queue[M.idx];const ok=parseInt(M.input,10)===answer(p);

function submitStack(){
  const p=M.queue[M.idx];const gr=gradeStack(M.model,M.st);
  const se=S.stackErr;se.probs++;if(gr.forgot)se.forgot++;if(gr.wrongC)se.carryWrong++;
  gr.cols.forEach(c=>{if(c.carry){se.colCarry++;if(!c.ok)se.colCarryBad++}else{se.colPlain++;if(!c.ok)se.colPlainBad++}});
  if(gr.allOK)S.stats.stackOK++;
  resolve(p,gr.allOK,{stack:true,after:()=>{renderStackLive(gr.marks);if(gr.allOK)okBanner(true,gr.forgot?t('ok.forgot'):gr.wrongC?t('ok.wrongC'):'')}});

  box.append(el('div','big',pick(OKW[L])));if(sub)box.append(el('div','sub',sub));fb.append(box);

function resolve(p,ok,opt){
  const secs=(performance.now()-M.t0)/1000,isReask=!!p.reask;M.lock=true;$('#kp').classList.add('locked');
  const key=keyOf(p),tierId=p.tier||(M.mode==='calib'?SECTOR_A[M.cal.tier].id:M.tier);
  if(M.mode==='calib')M.cal.n++;else if(!isReask)M.firsts++;
  logAnswer(p,ok,secs,tierId);
  if(ok){

  if(!mo){const mb=el('button','btn',t('openNow'));mb.onclick=()=>{P.multForced=true;save();parentPanel(P.id)};r1.append(mb)}b.append(r1);
  const r2=el('div','setrow');r2.append(el('span',null,t('recal')));const cb=el('button','btn',t('calibrate'));cb.onclick=()=>{closeModal();G.cur=P.id;S=P;save();startMission('calib','calib')};r2.append(cb);b.append(r2);
  const r3=el('div','setrow');r3.append(el('span',null,t('delProf',{n:P.name})));const db=el('button','btn danger',t('del'));
  db.onclick=()=>{if(db.dataset.arm){G.profiles=G.profiles.filter(x=>x!==P);if(G.cur===P.id){G.cur=null;S=null}save();closeModal();boot()}else{db.dataset.arm='1';db.textContent=t('confirmDel')}};r3.append(db);b.append(r3);
  const r4=el('div','setrow');r4.append(el('span',null,t('sound')));const sb=el('button','btn',G.mute?t('soundOn'):t('soundOff'));sb.onclick=()=>{G.mute=!G.mute;save();sb.textContent=G.mute?t('soundOn'):t('soundOff')};r4.append(sb);b.append(r4);
  if(!canSave)b.append(el('p','note',t('cantSave')));

  // export
  b.append(el('div','sec-h',t('exportH')));
  const exMsg=el('p','note');exMsg.setAttribute('aria-live','polite');
  const stamp=dayKey();const slug=P.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase()||'commander';
  const exRow=(label,desc,btnTxt,make)=>{const r=el('div','setrow');const tx=el('div');tx.style.minWidth='0';tx.append(el('div',null,label),el('div','label',desc));
    const bt=el('button','btn',btnTxt);bt.onclick=()=>offerFile(make(),exMsg);r.append(tx,bt);b.append(r)};
  exRow(t('exReport',{n:P.name}),t('exReportD'),t('exReportB'),()=>({filename:`${t('fn.report')}-${slug}-${stamp}.html`,data:reportHTMLFile(P)}));
  exRow(t('exData',{n:P.name}),t('exDataD'),t('exDataB'),()=>({filename:`${t('fn.data')}-${slug}-${stamp}.csv`,data:dailyCSV(P)}));
  exRow(t('exBk'),t('exBkD'),t('exBkB'),()=>({filename:`${t('fn.backup')}-${stamp}.json`,data:JSON.stringify({app:'missio-calcul',v:2,exported:new Date().toISOString(),lang:L,profiles:G.profiles},null,1)}));
  const rr=el('div','setrow');const rtx=el('div');rtx.append(el('div',null,t('restore')),el('div','label',t('restoreD')));
  const fi=el('input');fi.type='file';fi.accept='.json,application/json';fi.id='restore-file';fi.hidden=true;
  const rb=el('button','btn',t('pickFile'));rb.onclick=()=>fi.click();
  fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>restoreBackup(String(rd.result),exMsg,P.id);rd.onerror=()=>{exMsg.textContent=t('readFail')};rd.readAsText(f)};
  rr.append(rtx,rb,fi);b.append(rr);b.append(exMsg);
})}

/* ================= Export / restore ================= */
const dlPromise=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function offerFile(f,msg){
  const dl=await dlPromise;
  if(dl){
    try{await dl.save({filename:f.filename,data:f.data});msg.textContent=t('saved',{f:f.filename});return}
    catch(e){const c=e&&e.code;
      if(c==='declined'){msg.textContent=t('dlCancel');return}
      if(c==='rate_limited'){msg.textContent=t('dlBusy');return}
      if(c!=='unavailable'&&c!=='not_granted'&&c!=='capability_disabled'&&c!=='capability_removed'){msg.textContent=t('dlFail');return}}
  }
  if(!window.claude){try{const ext=f.filename.split('.').pop();const type={html:'text/html',csv:'text/csv',json:'application/json'}[ext]||'text/plain';
    const url=URL.createObjectURL(new Blob([f.data],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=f.filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);msg.textContent=t('saved',{f:f.filename});return}catch(e){}}
  try{await navigator.clipboard.writeText(f.data);msg.textContent=t('clipOk',{f:f.filename})}
  catch(e){msg.textContent=t('clipFail')}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dailyCSV(P){
  const sep=L==='en'?',':';',dec=x=>L==='en'?x:x.replace('.',',');
  const rows=[[t('csv.date'),t('csv.min'),t('thAnswers'),t('correct'),t('csv.wrong'),t('csv.pct')]];
  Object.keys(P.log).sort().forEach(d=>{const l=P.log[d],n=l.ok+l.bad;rows.push([d,dec((l.sec/60).toFixed(1)),n,l.ok,l.bad,n?Math.round(l.ok/n*100):''])});
  rows.push([]);rows.push([t('csv.type'),t('thAnswers'),t('correct'),t('csv.wrong'),t('csv.pct'),t('csv.avg')]);
  SKILLS.forEach(k=>{const s=P.skill[k]||{ok:0,bad:0,sec:0},n=s.ok+s.bad;rows.push([t('sk.'+k),n,s.ok,s.bad,n?Math.round(s.ok/n*100):'',n?Math.round(s.sec/n):''])});
  const q=v=>{v=String(v);return(v.includes(sep)||/["\n]/.test(v))?`"${v.replace(/"/g,'""')}"`:v};
  return '﻿'+rows.map(r=>r.map(q).join(sep)).join('\r\n');
}
function reportHTMLFile(P){
  const R=reportStats(P);const now=new Date();
  const tile=([l,v,s])=>`<div class="t"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s||'')}</div></div>`;
  const skRows=SKILLS.map(k=>{const s=P.skill[k]||{ok:0,bad:0,sec:0},n=s.ok+s.bad,pc=pct(s.ok,s.bad);return`<tr><td>${esc(t('sk.'+k))}</td><td class="n">${n}</td><td class="n">${pc==null?'–':pc+'%'}</td><td class="n">${n?Math.round(s.sec/n)+' s':'–'}</td></tr>`}).join('');
  const plRows=ALL.filter(x=>P.planet[x.id]||P.stars[x.id]).map(x=>{const st=P.planet[x.id]||{ok:0,bad:0},pc=pct(st.ok,st.bad);return`<tr><td>${esc(pn(x))}</td><td>${esc(ps(x))}</td><td class="n">${'★'.repeat(P.stars[x.id]||0)||'–'}</td><td class="n">${P.best[x.id]!=null?P.best[x.id]+'/10':'–'}</td><td class="n">${pc==null?'–':pc+'%'}</td></tr>`}).join('')||`<tr><td colspan="5">${esc(t('noMissions'))}</td></tr>`;
  const stackTxt=R.stackLines?`<ul>${R.stackLines.map((l,i)=>`<li>${esc(l+(i===2&&R.stackHard?' '+t('stackHard'):''))}</li>`).join('')}</ul>`:`<p>${esc(t('stackNone'))}</p>`;
  return `<!doctype html><html lang="${L}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(t('rep.title',{n:P.name}))} · ${esc(t('appName'))}</title>
<style>body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a2233;background:#fff;max-width:820px;margin:0 auto;padding:24px 16px;line-height:1.45}
h1{font-size:26px;margin:0}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:#2f6fd6;margin:28px 0 8px}.sub{color:#5a6378;margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:18px}.t{border:1px solid #d9dee8;border-radius:8px;padding:10px}.l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5a6378}.v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.s{font-size:12px;color:#5a6378}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e6e9f0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.w{overflow-x:auto}
.mono{font-family:ui-monospace,monospace;font-size:14px}footer{margin-top:32px;font-size:12px;color:#5a6378}@media print{body{padding:0}h2{break-after:avoid}}</style></head><body>
<h1>${esc(t('rep.title',{n:P.name}))}</h1><p class="sub">${esc(t('rep.sub',{app:t('appName'),s:P.ship,d:now.toLocaleDateString(LOCALE[L]),t:now.toLocaleTimeString(LOCALE[L],{hour:'2-digit',minute:'2-digit'})}))}</p>
<div class="tiles">${R.tiles.map(tile).join('')}</div>
<h2>${esc(t('chartH14'))}</h2><div class="w">${chartSVG(R)}</div>
<h2>${esc(t('skillsH'))}</h2><div class="w"><table><thead><tr><th>${esc(t('thType'))}</th><th class="n">${esc(t('thAnswers'))}</th><th class="n">${esc(t('thAcc'))}</th><th class="n">${esc(t('thAvg'))}</th></tr></thead><tbody>${skRows}</tbody></table></div>
<h2>${esc(t('stackH2'))}</h2>${stackTxt}
<h2>${esc(t('planetsH'))}</h2><div class="w"><table><thead><tr><th>${esc(t('thPlanet'))}</th><th>${esc(t('thSkill'))}</th><th class="n">${esc(t('thStars'))}</th><th class="n">${esc(t('thBest'))}</th><th class="n">${esc(t('thAcc'))}</th></tr></thead><tbody>${plRows}</tbody></table></div>
<h2>${esc(t('weakH'))}</h2>${R.weak.length?`<p class="mono">${R.weak.map(esc).join(' · ')}</p>`:`<p>${esc(t('weakNone'))}</p>`}
<footer>${esc(t('rep.foot',{m:lc(t(P.subMethod==='comp'?'comp':'borrow'))}))}</footer>
</body></html>`;
}
function restoreBackup(text,msg,keepId){
  let d;try{d=JSON.parse(text)}catch(e){msg.textContent=t('badBackup');return}
  if(!d||d.app!=='missio-calcul'||d.v!==2||!Array.isArray(d.profiles)||!d.profiles.length){msg.textContent=t('badBackup');return}
  const incoming=d.profiles.filter(p=>p&&p.id&&p.name).map(normalize);
  const upd=incoming.filter(p=>G.profiles.some(x=>x.id===p.id)).length,add=incoming.length-upd;
  openModal(b=>{modalHead(b,t('restoreH'));
    b.append(el('p','note',t('restoreHas',{n:incoming.length===1?t('cmdCount1'):t('cmdCountN',{n:incoming.length}),list:incoming.map(p=>p.name).join(', ')})));
    b.append(el('p','note',(add?t('restoreAdd',{n:add}):'')+(upd?t('restoreUpd',{n:upd}):'')));
    const r=el('div','res-actions');const y=el('button','btn primary',t('restoreBtn'));
    y.onclick=()=>{incoming.forEach(p=>{const i=G.profiles.findIndex(x=>x.id===p.id);if(i>=0)G.profiles[i]=p;else G.profiles.push(p)});
      if(S){S=G.profiles.find(x=>x.id===S.id)||null;if(S&&!$('#scr-bridge').hidden)renderBridge()}save();parentPanel(keepId);toast(t('t.backup'),t('t.restored'),'✓')};
    const n=el('button','btn',t('cancel'));n.onclick=()=>parentPanel(keepId);r.append(y,n);b.append(r)});
}

/* ================= Onboarding ================= */
$('#ob-ship').innerHTML=shipSVG(HULLS[0][1]);
$('#ob-go').onclick=()=>{
  const n=$('#in-name').value.trim(),sh=$('#in-ship').value.trim();
  if(!n){$('#in-name').focus();$('#in-name').placeholder=t('ob.nameReq');return}
  const p=blankProfile();p.name=n;p.ship=sh||'Estel-1';G.profiles.push(p);save();selectProfile(p.id);
};
$('#ob-cancel').onclick=()=>renderProfiles();

/* ================= Boot ================= */
function boot(){
  if(!G.profiles.length){startOnboard();return}
  if(G.profiles.length===1){selectProfile(G.profiles[0].id);return}
  renderProfiles();
}
setLang(G.lang||'ca');
boot();
})();
